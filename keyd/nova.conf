# Порт раскладки nova-42 на встроенную JIS-клавиатуру; id подставляет scripts/keyd-apply.sh

[ids]

__KEYBOARD_IDS__

[global]
chord_timeout = 150

[main]

a = overloadt(control, a, 150)
s = overloadt(alt, s, 150)
d = overloadt(meta, d, 150)
f = overloadt(shift, f, 150)
j = overloadt(shift, j, 150)
k = overloadt(meta, k, 150)
l = overloadt(alt, l, 150)
semicolon = overloadt(control, semicolon, 150)
leftalt = escape
rightalt = noop
muhenkan = layer(lower)
henkan = enter
katakanahiragana = layer(raise)
menu = backspace
compose = backspace
zenkakuhankaku = noop
yen = backslash
muhenkan+henkan = layer(std)
tab = grave
capslock = tab
leftshift = rightbrace
leftcontrol = noop
rightcontrol = noop
rightmeta = noop
rightshift = noop
escape = noop
backspace = noop
enter = noop
