# Порт раскладки nova-42 на встроенную JIS-клавиатуру; id подставляет scripts/keyd-apply.sh

[ids]

__KEYBOARD_IDS__

[main]

a = overload(control, a)
s = overload(alt, s)
d = overload(meta, d)
f = overload(shift, f)
j = overload(shift, j)
k = overload(meta, k)
l = overload(alt, l)
semicolon = overload(control, semicolon)
leftalt = escape
rightalt = noop
muhenkan = layer(lower)
henkan = enter
katakanahiragana = layer(raise)
menu = backspace
zenkakuhankaku = noop
yen = noop
muhenkan+henkan = layer(std)

[std]

a = a
s = s
d = d
f = f
j = j
k = k
l = l
semicolon = semicolon
leftalt = layer(alt)
rightalt = layer(altgr)
muhenkan = muhenkan
henkan = henkan
katakanahiragana = katakanahiragana
menu = menu
zenkakuhankaku = zenkakuhankaku
yen = yen

[lower]

q = f1
w = f2
e = f3
r = f4
t = previoussong
y = pageup
u = pagedown
i = home
o = end
p = delete
a = f5
s = f6
d = f7
f = f8
g = playpause
h = left
j = down
k = up
l = right
z = f9
x = f10
c = f11
v = f12
b = nextsong
n = volumedown
m = volumeup
comma = brightnessdown
dot = brightnessup
slash = mute

[raise]

q = ^
w = 1
e = 2
r = 3
t = +
y = =
u = [
i = ]
o = %
p = &
a = #
s = 4
d = 5
f = 6
g = -
h = _
j = (
k = )
l = *
semicolon = $
x = 7
c = 8
v = 9
b = 0
n = !
m = {
comma = }
dot = @
