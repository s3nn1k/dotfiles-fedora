font pango:sans 14
default_border none
default_floating_border none
gaps inner 0
gaps outer 0

input type:keyboard {
    xkb_layout us,ru
    xkb_options grp:ctrl_space_toggle
    repeat_delay 250
    repeat_rate 60
}

bindcode Mod1+43 focus left
bindcode Mod1+44 focus down
bindcode Mod1+45 focus up
bindcode Mod1+46 focus right

bindcode Mod1+Shift+43 move left
bindcode Mod1+Shift+44 move down
bindcode Mod1+Shift+45 move up
bindcode Mod1+Shift+46 move right

bindcode Mod1+24 workspace number 1
bindcode Mod1+25 workspace number 2
bindcode Mod1+26 workspace number 3
bindcode Mod1+27 workspace number 4
bindcode Mod1+28 workspace number 5
bindcode Mod1+29 workspace number 6
bindcode Mod1+30 workspace number 7
bindcode Mod1+31 workspace number 8
bindcode Mod1+32 workspace number 9
bindcode Mod1+33 workspace number 0

bindcode Mod1+Shift+24 move container to workspace number 1
bindcode Mod1+Shift+25 move container to workspace number 2
bindcode Mod1+Shift+26 move container to workspace number 3
bindcode Mod1+Shift+27 move container to workspace number 4
bindcode Mod1+Shift+28 move container to workspace number 5
bindcode Mod1+Shift+29 move container to workspace number 6
bindcode Mod1+Shift+30 move container to workspace number 7
bindcode Mod1+Shift+31 move container to workspace number 8
bindcode Mod1+Shift+32 move container to workspace number 9
bindcode Mod1+Shift+33 move container to workspace number 0

bindcode Mod1+39 mode "resize-custom"
bindcode Mod1+54 exec foot
bindcode Mod4+65 exec $menu
bindcode Mod4+24 kill
bindcode Mod4+Shift+54 reload
bindcode Mod4+53 exec swaynag -t warning -m "Выйти из Sway?" -B "Выйти" "swaymsg exit"
bindcode Mod1+23 workspace back_and_forth
bindcode Mod1+Shift+23 move workspace to output next
bindcode Mod1+51 layout toggle split

mode "resize-custom" {
    bindcode 43 resize shrink width 50 px
    bindcode 44 resize grow height 50 px
    bindcode 45 resize shrink height 50 px
    bindcode 46 resize grow width 50 px
    bindcode 9 mode "default"
    bindcode 36 mode "default"
}
