onboarding = false
# herdr — config.toml (симлинк из ~/dotfiles-fedora/herdr.toml)
# reload: herdr server reload-config; дефолты: herdr --default-config

[theme]
name = "terminal" # палитра хост-терминала (zenwritten в iTerm)

[theme.custom]
accent = "bright blue" # ANSI-слот 12 профиля (#a7abf2), следует за палитрой iTerm

[keys]
prefix = "ctrl+b" # ctrl+space занят переключением раскладок macOS

# --- фокус и раскладка панелей -----------------------------------------
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

split_vertical = "prefix+v"        # панель справа
close_pane = "prefix+d"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

resize_pane_left = "prefix+shift+left"
resize_pane_down = "prefix+shift+down"
resize_pane_up = "prefix+shift+up"
resize_pane_right = "prefix+shift+right"

# --- воркспейсы ----------------------------------------------------------
# f — как find-группа в nvim; ↑↓ — колонка воркспейсов в сайдбаре
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
workspace_picker = "prefix+f"
new_workspace = "prefix+shift+n"
close_workspace = "prefix+shift+d"

# --- сессия и сервис ------------------------------------------------------
help = "prefix+?"
open_notification_target = ""
toggle_sidebar = ""       # collapse не используем: expanded всегда, узко
detach = "prefix+x"

# --- табы ----------------------------------------------------------------
new_tab = "prefix+n"
next_tab = "prefix+tab"
previous_tab = "prefix+shift+tab"
switch_tab = "prefix+1..9"

# --- отключено ------------------------------------------------------------
# zoom/copy_mode/агенты-ряды/последняя панель — на всякий случай погашены,
# чтобы ничего не сработало случайно
rename_tab = ""
close_tab = ""
move_tab_previous = ""
move_tab_next = ""
switch_workspace = ""    # indexed-синтаксис не умеет буквенные ряды — ряд q..p ниже
zoom = ""
copy_mode = ""
last_pane = ""
cycle_pane_next = ""
cycle_pane_previous = ""
open_worktree = ""
remove_worktree = ""
previous_agent = ""
next_agent = ""
focus_agent = ""
remote_image_paste = ""  # ctrl+v вставка картинок, активна только в --remote
reload_config = ""       # из шелла: herdr server reload-config
resize_mode = ""         # серии ресайза не нужны, есть shift+стрелки
rename_workspace = ""
new_worktree = ""        # git worktree — решает агент, не руками
goto = ""                # цифры 1..9 внутри не перенастраиваются
settings = ""            # всё есть в config.toml
edit_scrollback = ""     # мышкой
rename_pane = ""
split_horizontal = ""    # h занят под навигацию

# --- воркспейсы: prefix+q..p = ws по пин-букве (state ws-keys) ------------
[[keys.command]]
key = "prefix+q"
type = "shell"
command = "herdr-tab ws q"

[[keys.command]]
key = "prefix+w"
type = "shell"
command = "herdr-tab ws w"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = "herdr-tab ws e"

[[keys.command]]
key = "prefix+r"
type = "shell"
command = "herdr-tab ws r"

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "herdr-tab ws t"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = "herdr-tab ws y"

[[keys.command]]
key = "prefix+u"
type = "shell"
command = "herdr-tab ws u"

[[keys.command]]
key = "prefix+i"
type = "shell"
command = "herdr-tab ws i"

[[keys.command]]
key = "prefix+o"
type = "shell"
command = "herdr-tab ws o"

[[keys.command]]
key = "prefix+p"
type = "shell"
command = "herdr-tab ws p"

# --- унести панель в ws по пин-букве: prefix+shift+q..p -------------------
# уносит только текущую панель — переноса целого таба в API herdr нет
[[keys.command]]
key = "prefix+shift+q"
type = "shell"
command = "herdr-tab move q"

[[keys.command]]
key = "prefix+shift+w"
type = "shell"
command = "herdr-tab move w"

[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = "herdr-tab move e"

[[keys.command]]
key = "prefix+shift+r"
type = "shell"
command = "herdr-tab move r"

[[keys.command]]
key = "prefix+shift+t"
type = "shell"
command = "herdr-tab move t"

[[keys.command]]
key = "prefix+shift+y"
type = "shell"
command = "herdr-tab move y"

[[keys.command]]
key = "prefix+shift+u"
type = "shell"
command = "herdr-tab move u"

[[keys.command]]
key = "prefix+shift+i"
type = "shell"
command = "herdr-tab move i"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "herdr-tab move o"

[[keys.command]]
key = "prefix+shift+p"
type = "shell"
command = "herdr-tab move p"

[ui]
hide_tab_bar_when_single_tab = true
sidebar_start_collapsed = false        # expanded всегда (collapsed не показывает $key)
sidebar_min_width = 10                 # пол из исходников: жёсткого нет, влезает [q]1*
sidebar_width = 12
sidebar_max_width = 14
prompt_new_tab_name = false         # случайный таб не дёргает диалог имени
status_indicators = "symbols"       # глифы по форме + цвет состояния
pane_gaps = false                   # панели делятся общим разделителем, без зазоров
pane_outer_borders = false          # без внешней рамки — tmux-стиль

[ui.sound]
enabled = false # без звука на done/needs-attention

[ui.sidebar.agents]
# [q]1<индикатор> = воркспейс-буква + номер таба + состояние; имя агента ниже
rows = [["$key", "tab", "state_icon"], ["agent"]]

[ui.sidebar.spaces]
# $key = "[r]" одним токеном от ws-keys; branch-строку убрали за компактность
rows = [["state_icon", "$key"]]
