# herdr — config.toml (симлинк из ~/dotfiles-fedora/herdr.toml)
# reload: herdr server reload-config; дефолты: herdr --default-config
onboarding = false

# --- тема: zenwritten_dark ---------------------------------------------------
# Оттенки — только палитра zenwritten_dark.omp.json: #608b4e (❯), #e5c07b,
# #d4d4d4, #f48771. Фон и поверхности — bg foot #15191f и производные:
# в omp-теме фона нет. Смена темы: сменить name на встроенную и убрать custom.
[theme]
name = "terminal" # база для токенов без override: follows ANSI-слотам терминала

[theme.custom]
text = "#d4d4d4"
subtext0 = "#d4d4d4"
surface_dim = "#12161b"
surface0 = "#1b2027"
surface1 = "#232931"
overlay0 = "#4a5261"
overlay1 = "#5b6472"
sidebar_bg = "#15191f"
active_row_bg = "#232931"
selection_bg = "#2a3140"
panel_bg = "#15191f" # таббар и панели: ровно bg foot, без ступеньки
accent = "#608b4e"
red = "#f48771"
green = "#608b4e"
yellow = "#e5c07b"
blue = "#608b4e"
teal = "#e5c07b"
peach = "#f48771"
mauve = "#e5c07b"

# --- клавиши -------------------------------------------------------------------
[keys]
prefix = "ctrl+b" # ctrl+space занят переключением раскладок macOS

# фокус и раскладка панелей
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

split_vertical = "prefix+v"        # панель справа
close_pane = "prefix+d"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

resize_pane_left = "prefix+shift+left"
resize_pane_down = "prefix+shift+down"
resize_pane_up = "prefix+shift+up"
resize_pane_right = "prefix+shift+right"

# воркспейсы: f — как find-группа в nvim; ↑↓ — колонка воркспейсов в сайдбаре
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
workspace_picker = "prefix+f"
new_workspace = "prefix+shift+n"
close_workspace = "prefix+shift+d"

# сессия и сервис
help = "prefix+?"
open_notification_target = ""
toggle_sidebar = "prefix+b"  # сайдбар скрыт; b показывает по запросу
detach = "prefix+x"

# табы
new_tab = "prefix+n"
next_tab = "prefix+tab"
previous_tab = "prefix+shift+tab"
switch_tab = "prefix+1..9"

# отключено: zoom/copy_mode/агенты-ряды/последняя панель — погашены, чтобы
# ничего не сработало случайно
rename_tab = ""
close_tab = ""
move_tab_previous = ""
move_tab_next = ""
switch_workspace = ""    # цифры 1..9 отданы табам; ws — пикер f и стрелки
zoom = ""
copy_mode = ""
last_pane = ""
cycle_pane_next = ""
cycle_pane_previous = ""
open_worktree = ""
remove_worktree = ""
previous_agent = ""
next_agent = ""
focus_agent = ""
remote_image_paste = ""  # ctrl+v вставка картинок, активна только в --remote
reload_config = ""       # из шелла: herdr server reload-config
resize_mode = ""         # серии ресайза не нужны, есть shift+стрелки
rename_workspace = ""
new_worktree = ""        # git worktree — решает агент, не руками
goto = ""                # цифры 1..9 внутри не перенастраиваются
settings = ""            # всё есть в config.toml
edit_scrollback = ""     # мышкой
rename_pane = ""
split_horizontal = ""    # h занят под навигацию

# воркспейсы по позиции сайдбара: q..p -> 1..10; shift-ряд переносит панель (скрипт bin/herdr-ws.sh)
[[keys.command]]
key = "prefix+q"
type = "shell"
command = "herdr-ws focus 1"

[[keys.command]]
key = "prefix+w"
type = "shell"
command = "herdr-ws focus 2"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = "herdr-ws focus 3"

[[keys.command]]
key = "prefix+r"
type = "shell"
command = "herdr-ws focus 4"

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "herdr-ws focus 5"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = "herdr-ws focus 6"

[[keys.command]]
key = "prefix+u"
type = "shell"
command = "herdr-ws focus 7"

[[keys.command]]
key = "prefix+i"
type = "shell"
command = "herdr-ws focus 8"

[[keys.command]]
key = "prefix+o"
type = "shell"
command = "herdr-ws focus 9"

[[keys.command]]
key = "prefix+p"
type = "shell"
command = "herdr-ws focus 10"

# перенос панели в воркспейс по позиции сайдбара: shift+q..p -> 1..10
[[keys.command]]
key = "prefix+shift+q"
type = "shell"
command = "herdr-ws move-ws 1"

[[keys.command]]
key = "prefix+shift+w"
type = "shell"
command = "herdr-ws move-ws 2"

[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = "herdr-ws move-ws 3"

[[keys.command]]
key = "prefix+shift+r"
type = "shell"
command = "herdr-ws move-ws 4"

[[keys.command]]
key = "prefix+shift+t"
type = "shell"
command = "herdr-ws move-ws 5"

[[keys.command]]
key = "prefix+shift+y"
type = "shell"
command = "herdr-ws move-ws 6"

[[keys.command]]
key = "prefix+shift+u"
type = "shell"
command = "herdr-ws move-ws 7"

[[keys.command]]
key = "prefix+shift+i"
type = "shell"
command = "herdr-ws move-ws 8"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "herdr-ws move-ws 9"

[[keys.command]]
key = "prefix+shift+p"
type = "shell"
command = "herdr-ws move-ws 10"

# перенос панели в таб: shift+1..9 -> номер таба в воркспейсе панели
[[keys.command]]
key = "prefix+shift+1"
type = "shell"
command = "herdr-ws move-tab 1"

[[keys.command]]
key = "prefix+shift+2"
type = "shell"
command = "herdr-ws move-tab 2"

[[keys.command]]
key = "prefix+shift+3"
type = "shell"
command = "herdr-ws move-tab 3"

[[keys.command]]
key = "prefix+shift+4"
type = "shell"
command = "herdr-ws move-tab 4"

[[keys.command]]
key = "prefix+shift+5"
type = "shell"
command = "herdr-ws move-tab 5"

[[keys.command]]
key = "prefix+shift+6"
type = "shell"
command = "herdr-ws move-tab 6"

[[keys.command]]
key = "prefix+shift+7"
type = "shell"
command = "herdr-ws move-tab 7"

[[keys.command]]
key = "prefix+shift+8"
type = "shell"
command = "herdr-ws move-tab 8"

[[keys.command]]
key = "prefix+shift+9"
type = "shell"
command = "herdr-ws move-tab 9"

# --- ui ----------------------------------------------------------------------
[ui]
hide_tab_bar_when_single_tab = false  # таббар как статус-строка: виден всегда
tab_bar_position = "bottom"
sidebar_start_collapsed = true         # сайдбара нет вообще
sidebar_collapsed_mode = "hidden"      # collapse прячет целиком; prefix+b — показать
prompt_new_tab_name = false         # случайный таб не дёргает диалог имени
status_indicators = "symbols"       # глифы по форме + цвет состояния
pane_gaps = false                   # панели делятся общим разделителем, без зазоров
pane_outer_borders = false          # без внешней рамки — tmux-стиль

[ui.sound]
enabled = false # без звука на done/needs-attention
