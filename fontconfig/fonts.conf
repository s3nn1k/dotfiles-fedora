<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Fedora поставляет Noto Color Emoji в COLRv1, который foot/fcft не растеризует
       (dnkl/fcft#114); скрываем его, чтобы эмодзи-фолбэк брал CBDT-сборку из
       ~/.local/share/fonts/NotoColorEmoji (ставится bootstrap.sh). -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/google-noto-color-emoji-fonts/Noto-COLRv1.ttf</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
