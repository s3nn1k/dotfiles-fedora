# herdr — config.toml (симлинк из ~/dotfiles-fedora/herdr/config.toml)
onboarding = false

# --- тема: zenwritten_dark ----------------------------------------------------
# оттенки — палитра zenwritten_dark.omp.json; фон и поверхности — bg foot
# #15191f и производные (в omp-теме фона нет)
[theme]
name = "terminal"

[theme.custom]
text = "#d4d4d4"
subtext0 = "#d4d4d4"
surface_dim = "#12161b"
surface0 = "#1b2027"
surface1 = "#232931"
overlay0 = "#4a5261"
overlay1 = "#5b6472"
sidebar_bg = "#15191f"
active_row_bg = "#232931"
selection_bg = "#2a3140"
panel_bg = "#15191f"
accent = "#608b4e"
red = "#f48771"
green = "#608b4e"
yellow = "#e5c07b"
blue = "#608b4e"
teal = "#e5c07b"
peach = "#f48771"
mauve = "#e5c07b"

# --- клавиши -------------------------------------------------------------------
[keys]
prefix = "ctrl+b"

# фокус и раскладка панелей
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

split_vertical = "prefix+v"
close_pane = "prefix+d"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

resize_pane_left = "prefix+shift+left"
resize_pane_down = "prefix+shift+down"
resize_pane_up = "prefix+shift+up"
resize_pane_right = "prefix+shift+right"

# воркспейсы
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
workspace_picker = "prefix+f"
new_workspace = "prefix+shift+n"
close_workspace = "prefix+shift+d"

# сессия и сервис
help = "prefix+?"
open_notification_target = ""
toggle_sidebar = "prefix+b"
detach = "prefix+x"

# табы
new_tab = "prefix+n"
next_tab = "prefix+tab"
previous_tab = "prefix+shift+tab"
switch_tab = "prefix+1..9"

# отключено
rename_tab = ""
close_tab = ""
zoom = ""
cycle_pane_next = ""
cycle_pane_previous = ""
remote_image_paste = ""
reload_config = ""
resize_mode = ""
rename_workspace = ""
new_worktree = ""
goto = ""
settings = ""
edit_scrollback = ""
rename_pane = ""
split_horizontal = ""

# ws по позиции сайдбара: q..p -> фокус, shift+q..p -> перенос панели
# (скрипт bin/herdr-ws.sh)
[[keys.command]]
key = "prefix+q"
type = "shell"
command = "herdr-ws focus 1"

[[keys.command]]
key = "prefix+w"
type = "shell"
command = "herdr-ws focus 2"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = "herdr-ws focus 3"

[[keys.command]]
key = "prefix+r"
type = "shell"
command = "herdr-ws focus 4"

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "herdr-ws focus 5"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = "herdr-ws focus 6"

[[keys.command]]
key = "prefix+u"
type = "shell"
command = "herdr-ws focus 7"

[[keys.command]]
key = "prefix+i"
type = "shell"
command = "herdr-ws focus 8"

[[keys.command]]
key = "prefix+o"
type = "shell"
command = "herdr-ws focus 9"

[[keys.command]]
key = "prefix+p"
type = "shell"
command = "herdr-ws focus 10"

# перенос панели в ws: shift+q..p -> 1..10
[[keys.command]]
key = "prefix+shift+q"
type = "shell"
command = "herdr-ws move-ws 1"

[[keys.command]]
key = "prefix+shift+w"
type = "shell"
command = "herdr-ws move-ws 2"

[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = "herdr-ws move-ws 3"

[[keys.command]]
key = "prefix+shift+r"
type = "shell"
command = "herdr-ws move-ws 4"

[[keys.command]]
key = "prefix+shift+t"
type = "shell"
command = "herdr-ws move-ws 5"

[[keys.command]]
key = "prefix+shift+y"
type = "shell"
command = "herdr-ws move-ws 6"

[[keys.command]]
key = "prefix+shift+u"
type = "shell"
command = "herdr-ws move-ws 7"

[[keys.command]]
key = "prefix+shift+i"
type = "shell"
command = "herdr-ws move-ws 8"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "herdr-ws move-ws 9"

[[keys.command]]
key = "prefix+shift+p"
type = "shell"
command = "herdr-ws move-ws 10"

# перенос панели в таб: shift+1..9
[[keys.command]]
key = "prefix+shift+1"
type = "shell"
command = "herdr-ws move-tab 1"

[[keys.command]]
key = "prefix+shift+2"
type = "shell"
command = "herdr-ws move-tab 2"

[[keys.command]]
key = "prefix+shift+3"
type = "shell"
command = "herdr-ws move-tab 3"

[[keys.command]]
key = "prefix+shift+4"
type = "shell"
command = "herdr-ws move-tab 4"

[[keys.command]]
key = "prefix+shift+5"
type = "shell"
command = "herdr-ws move-tab 5"

[[keys.command]]
key = "prefix+shift+6"
type = "shell"
command = "herdr-ws move-tab 6"

[[keys.command]]
key = "prefix+shift+7"
type = "shell"
command = "herdr-ws move-tab 7"

[[keys.command]]
key = "prefix+shift+8"
type = "shell"
command = "herdr-ws move-tab 8"

[[keys.command]]
key = "prefix+shift+9"
type = "shell"
command = "herdr-ws move-tab 9"

# переименование агента панели: prefix+m (скрипт bin/herdr-agent-rename)
[[keys.command]]
key = "prefix+m"
type = "popup"
command = "herdr-agent-rename"
description = "rename agent"

# --- ui ----------------------------------------------------------------------
[ui]
hide_tab_bar_when_single_tab = false
tab_bar_position = "bottom"
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
prompt_new_tab_name = false
status_indicators = "symbols"
pane_gaps = false
pane_outer_borders = false

[ui.sound]
enabled = false
